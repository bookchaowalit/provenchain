# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Nothing is deployed from this repository; the contract is compiled and tested locally only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenchain:
    # `npm test` runs node --test: document hashing plus a solc compile of NotaryRegistry.sol.
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      node-version: "22" # package.json engines: node >=20
      lint-command: "" # follow-up: no linter configured yet (plain ESM .mjs); adopt Biome separately
      typecheck-command: "" # plain JavaScript, no tsconfig

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
